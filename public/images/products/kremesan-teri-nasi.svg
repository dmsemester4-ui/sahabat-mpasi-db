    <rect x="26" y="75" width="228" height="368" rx="32" fill="url(#crumb-grad)" opacity="0.88"/>
    <rect x="38" y="12" width="204" height="54" rx="14" fill="url(#lid-grad)" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="20" y="150" width="240" height="235" fill="url(#label-teri)"/>
    <rect x="20" y="150" width="240" height="8" fill="#FDE047"/>
    <rect x="20" y="377" width="240" height="8" fill="#FDE047"/>

    <g transform="translate(140, 184)" text-anchor="middle" font-family="'Nunito', sans-serif">
      <rect x="-68" y="-18" width="136" height="24" rx="12" fill="#FFFFFF"/>
      <text y="-2" font-size="12" font-weight="800" fill="#15803D">SAHABAT MPASI</text>
      <text y="28" font-size="24" font-weight="800" fill="#FFFFFF">Kremesan</text>
      <text y="52" font-size="22" font-weight="800" fill="#FDE047">Double Prohe</text>
      <text y="74" font-size="12" font-weight="700" fill="#DCFCE7">Ikan Teri Nasi Segar + Telur Bebek</text>

