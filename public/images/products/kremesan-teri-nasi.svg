    <path d="M120,38 L310,12 C322,10 328,26 314,32 L125,64 Z" fill="#B45309"/>
    <ellipse cx="95" cy="46" rx="88" ry="36" fill="#92400E"/>
    <ellipse cx="95" cy="40" rx="82" ry="30" fill="url(#crumb-grad)"/>
    <g fill="#FEF08A">
      <circle cx="55" cy="36" r="7"/><circle cx="75" cy="28" r="9"/><circle cx="98" cy="34" r="10"/><circle cx="122" cy="29" r="8"/><circle cx="142" cy="40" r="7"/>
