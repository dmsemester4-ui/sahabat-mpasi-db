    <rect x="32" y="10" width="164" height="46" rx="12" fill="url(#lid-grad)" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="16" y="135" width="196" height="195" fill="url(#label-teri)"/>
    <rect x="16" y="135" width="196" height="6" fill="#FDE047"/>
    <rect x="16" y="324" width="196" height="6" fill="#FDE047"/>
    <g transform="translate(114, 168)" text-anchor="middle" font-family="'Nunito', sans-serif">
      <text y="0" font-size="11" font-weight="800" fill="#FDE047">SAHABAT MPASI</text>
      <text y="24" font-size="20" font-weight="800" fill="#FFFFFF">Kremesan</text>
      <text y="44" font-size="18" font-weight="800" fill="#FDE047">Double Prohe</text>
