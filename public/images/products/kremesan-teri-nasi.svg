    <text y="-2" font-size="22" font-weight="800" fill="#5B5147">Sahabat <tspan fill="#15803D">MPASI</tspan></text>
    <text y="46" font-size="28" font-weight="800" fill="#5B5147">Kremesan Teri Nasi</text>
    <text y="74" font-size="16" font-weight="700" fill="#15803D">Double Prohe · Tinggi Kalsium, Protein &amp; Telur Bebek Free-Range</text>
  </g>

  <ellipse cx="400" cy="675" rx="250" ry="28" fill="#5B5147" opacity="0.12"/>

