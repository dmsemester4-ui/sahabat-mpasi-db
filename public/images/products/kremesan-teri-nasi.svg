  <rect width="800" height="800" rx="36" fill="url(#bg-teri)"/>
  <circle cx="400" cy="410" r="280" fill="#DCFCE7" opacity="0.55"/>

  <g transform="translate(400, 68)" text-anchor="middle" font-family="'Nunito', 'Plus Jakarta Sans', sans-serif">
