  <g transform="translate(320, 175)" filter="url(#soft-shadow)">
    <path d="M24,0 L316,0 C328,0 336,10 334,24 L314,476 C312,490 302,498 288,498 L52,498 C38,498 28,490 26,476 L6,24 C4,10 12,0 24,0 Z" fill="url(#pouch-grad)" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="16" y1="48" x2="324" y2="48" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="16" y1="56" x2="324" y2="56" stroke="#E5E7EB" stroke-width="2"/>

