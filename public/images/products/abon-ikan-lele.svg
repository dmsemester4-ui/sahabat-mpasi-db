      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F7EFE1"/>
    </radialGradient>
    <linearGradient id="pouch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9FAFB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
