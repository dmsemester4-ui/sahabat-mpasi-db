    </linearGradient>
    <linearGradient id="abon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-10%" width="130%" height="130%">
