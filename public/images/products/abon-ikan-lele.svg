  <g transform="translate(140, 445)" filter="url(#soft-shadow)">
    <path d="M35,110 C40,45 95,18 140,18 C185,18 240,45 245,110 Z" fill="url(#abon-grad)"/>
    <g fill="#FDBA74" opacity="0.75">
      <circle cx="95" cy="65" r="9"/><circle cx="125" cy="48" r="11"/><circle cx="155" cy="54" r="10"/><circle cx="180" cy="72" r="9"/>
      <circle cx="75" cy="88" r="10"/><circle cx="115" cy="82" r="12"/><circle cx="150" cy="85" r="11"/><circle cx="195" cy="92" r="10"/>
    </g>
    <path d="M20,105 L260,105 L230,205 C224,220 205,228 140,228 C75,228 56,220 50,205 Z" fill="#FFFFFF" fill-opacity="0.55" stroke="#E5E7EB" stroke-width="4"/>
    <path d="M38,112 L242,112 L218,195 C212,206 195,212 140,212 C85,212 68,206 62,195 Z" fill="url(#abon-grad)" opacity="0.88"/>
    <ellipse cx="140" cy="105" rx="124" ry="14" fill="#FFFFFF" fill-opacity="0.7" stroke="#D1D5DB" stroke-width="3"/>
