      <rect x="-98" y="20" width="196" height="72" rx="36" fill="#FFFFFF"/>
      <text y="48" font-size="22" font-weight="800" fill="#431407">ABON</text>
      <text y="72" font-size="19" font-weight="800" fill="#C2410C">IKAN LELE</text>
      <text x="58" y="86" font-size="11" font-weight="800" fill="#15803D">Tekstur Halus</text>

      <text y="110" font-size="10.5" font-weight="700" fill="#FFFFFF">Komposisi: Daging Ikan Lele Segar, Rempah Alami,</text>
