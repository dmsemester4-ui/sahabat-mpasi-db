        <text y="18">✓ Tanpa MSG &amp; Pengawet</text>
        <text y="36">✓ Tanpa Gula/Garam Rafinasi</text>
        <text y="54">✓ Kaya Omega 3 &amp; 6</text>
        <text y="72">✓ Minyak Kelapa Murni</text>
      </g>

