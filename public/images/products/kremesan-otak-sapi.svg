<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg-otak" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F7EFE1"/>
    </radialGradient>
    <linearGradient id="lid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="label-otak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="crumb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5B5147" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#bg-otak)"/>
  <circle cx="400" cy="410" r="280" fill="#FCE7F3" opacity="0.45"/>

  <!-- Top Brand Header -->
  <g transform="translate(400, 68)" text-anchor="middle" font-family="'Nunito', 'Plus Jakarta Sans', sans-serif">
    <rect x="-135" y="-30" width="270" height="44" rx="22" fill="#FFFFFF" stroke="#FBCFE8" stroke-width="2"/>
    <text y="-2" font-size="22" font-weight="800" fill="#5B5147">Sahabat <tspan fill="#DB2777">MPASI</tspan></text>
    <text y="46" font-size="28" font-weight="800" fill="#5B5147">Kremesan Otak Sapi</text>
    <text y="74" font-size="16" font-weight="700" fill="#9D174D">Double Prohe · Otak Sapi Grass-Fed &amp; Telur Bebek Free-Range</text>
  </g>

  <!-- Floor shadow -->
  <ellipse cx="400" cy="675" rx="250" ry="28" fill="#5B5147" opacity="0.12"/>

  <!-- Left Main Jar (125gr) -->
  <g transform="translate(175, 195)" filter="url(#soft-shadow)">
    <!-- Jar Body -->
    <rect x="20" y="62" width="240" height="390" rx="38" fill="#FEF3C7" stroke="#FDE68A" stroke-width="3"/>
    <!-- Kremesan Texture Inside Jar -->
    <rect x="26" y="75" width="228" height="368" rx="32" fill="url(#crumb-grad)" opacity="0.88"/>
    <g fill="#FEF08A" opacity="0.75">
      <circle cx="65" cy="110" r="8"/><circle cx="95" cy="102" r="6"/><circle cx="135" cy="114" r="9"/><circle cx="180" cy="105" r="7"/><circle cx="215" cy="116" r="8"/>
      <circle cx="55" cy="135" r="7"/><circle cx="115" cy="130" r="10"/><circle cx="160" cy="132" r="8"/><circle cx="200" cy="136" r="9"/>
      <circle cx="70" cy="410" r="8"/><circle cx="110" cy="420" r="9"/><circle cx="155" cy="415" r="7"/><circle cx="195" cy="422" r="10"/><circle cx="225" cy="408" r="7"/>
      <circle cx="50" cy="428" r="6"/><circle cx="135" cy="430" r="8"/><circle cx="175" cy="429" r="7"/>
    </g>
    <!-- Jar Lid -->
    <rect x="38" y="12" width="204" height="54" rx="14" fill="url(#lid-grad)" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="55" y1="24" x2="55" y2="56" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="85" y1="24" x2="85" y2="56" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="115" y1="24" x2="115" y2="56" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="145" y1="24" x2="145" y2="56" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="175" y1="24" x2="175" y2="56" stroke="#E5E7EB" stroke-width="3"/>
    <line x1="205" y1="24" x2="205" y2="56" stroke="#E5E7EB" stroke-width="3"/>

    <!-- Jar Label -->
    <rect x="20" y="150" width="240" height="235" fill="url(#label-otak)"/>
    <rect x="20" y="150" width="240" height="8" fill="#FDE047"/>
    <rect x="20" y="377" width="240" height="8" fill="#FDE047"/>

    <g transform="translate(140, 184)" text-anchor="middle" font-family="'Nunito', sans-serif">
      <rect x="-68" y="-18" width="136" height="24" rx="12" fill="#FFFFFF"/>
      <text y="-2" font-size="12" font-weight="800" fill="#9D174D">SAHABAT MPASI</text>
      <text y="28" font-size="24" font-weight="800" fill="#FFFFFF">Kremesan</text>
      <text y="52" font-size="22" font-weight="800" fill="#FDE047">Double Prohe</text>
      <text y="74" font-size="12" font-weight="700" fill="#FCE7F3">Otak Sapi Grass-Fed + Telur Bebek</text>

      <!-- Cute Cow & Brain Nutrition Badge -->
      <rect x="-92" y="90" width="184" height="44" rx="12" fill="#FFFFFF" opacity="0.96"/>
      <text x="0" y="109" font-size="13" font-weight="800" fill="#9D174D">KREMESAN OTAK SAPI</text>
      <text x="0" y="126" font-size="11" font-weight="700" fill="#3B5E38">Grass-Fed · Kaya DHA &amp; Kolin</text>

      <!-- Netto & Halal Badges -->
      <rect x="-92" y="144" width="84" height="26" rx="8" fill="#FEF08A"/>
      <text x="-50" y="161" font-size="12" font-weight="800" fill="#713F12">Netto: 125gr</text>
      <rect x="8" y="144" width="84" height="26" rx="8" fill="#DCFCE7"/>
      <text x="50" y="161" font-size="12" font-weight="800" fill="#166534">Halal · 6+ Bln</text>
    </g>

    <!-- Glass Highlight -->
    <rect x="34" y="75" width="18" height="360" rx="9" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Right Travel Jar (80gr) -->
  <g transform="translate(435, 245)" filter="url(#soft-shadow)">
    <rect x="16" y="54" width="196" height="340" rx="32" fill="#FEF3C7" stroke="#FDE68A" stroke-width="3"/>
    <rect x="22" y="64" width="184" height="320" rx="28" fill="url(#crumb-grad)" opacity="0.9"/>
    <rect x="32" y="10" width="164" height="46" rx="12" fill="url(#lid-grad)" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="16" y="135" width="196" height="195" fill="url(#label-otak)"/>
    <rect x="16" y="135" width="196" height="6" fill="#FDE047"/>
    <rect x="16" y="324" width="196" height="6" fill="#FDE047"/>
    <g transform="translate(114, 168)" text-anchor="middle" font-family="'Nunito', sans-serif">
      <text y="0" font-size="11" font-weight="800" fill="#FDE047">SAHABAT MPASI</text>
      <text y="24" font-size="20" font-weight="800" fill="#FFFFFF">Kremesan</text>
      <text y="44" font-size="18" font-weight="800" fill="#FDE047">Double Prohe</text>
      <rect x="-78" y="60" width="156" height="38" rx="10" fill="#FFFFFF"/>
      <text x="0" y="77" font-size="11" font-weight="800" fill="#9D174D">KREMESAN OTAK SAPI</text>
      <text x="0" y="91" font-size="10" font-weight="700" fill="#5B5147">Kemasan Travel 80gr</text>
      <rect x="-55" y="108" width="110" height="24" rx="8" fill="#FEF08A"/>
      <text x="0" y="124" font-size="11" font-weight="800" fill="#713F12">109 kkal · 8,5g Prot</text>
    </g>
    <rect x="28" y="66" width="14" height="310" rx="7" fill="#FFFFFF" opacity="0.32"/>
  </g>

  <!-- Wooden Spoon with Golden Kremesan in Foreground -->
  <g transform="translate(390, 595)" filter="url(#soft-shadow)">
    <path d="M120,38 L310,12 C322,10 328,26 314,32 L125,64 Z" fill="#B45309"/>
    <ellipse cx="95" cy="46" rx="88" ry="36" fill="#92400E"/>
    <ellipse cx="95" cy="40" rx="82" ry="30" fill="url(#crumb-grad)"/>
    <g fill="#FEF08A">
      <circle cx="55" cy="36" r="7"/><circle cx="75" cy="28" r="9"/><circle cx="98" cy="34" r="10"/><circle cx="122" cy="29" r="8"/><circle cx="142" cy="40" r="7"/>
      <circle cx="68" cy="46" r="8"/><circle cx="95" cy="48" r="9"/><circle cx="118" cy="44" r="8"/><circle cx="86" cy="22" r="7"/><circle cx="108" cy="24" r="7"/>
    </g>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(400, 738)" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">
    <rect x="-340" y="-22" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="-235" y="1" fill="#3B5E38">✓ Pelopor No. 1 di Indonesia</text>
    <rect x="-110" y="-22" width="220" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="0" y="1" fill="#9D174D">✓ Digoreng Minyak Kelapa</text>
    <rect x="130" y="-22" width="210" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="235" y="1" fill="#5B5147">✓ Tanpa Pengawet &amp; MSG</text>
  </g>
</svg>
